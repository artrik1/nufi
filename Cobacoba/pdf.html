<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAK IMAM PDF CONVERTER</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef1f7;--ink:#121a36;--mute:#59647f;--card:#fff;--line:#d3d9e8;--acc:#e3202f;--acc-ink:#fff;--acc2:#1d3fd8;--ok:#13804a;--err:#c2271d;--sh:0 1px 0 rgba(18,26,54,.06),0 10px 30px -12px rgba(18,26,54,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1021;--ink:#eaeefb;--mute:#97a3c4;--card:#141b34;--line:#2a3558;--acc:#ff4a57;--acc-ink:#fff;--acc2:#7f9bff;--ok:#4ade80;--err:#ff8a80;--sh:0 10px 30px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0b1021;--ink:#eaeefb;--mute:#97a3c4;--card:#141b34;--line:#2a3558;--acc:#ff4a57;--acc-ink:#fff;--acc2:#7f9bff;--ok:#4ade80;--err:#ff8a80;--sh:0 10px 30px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 0);background-size:22px 22px}
main{max-width:880px;margin:0 auto;padding:36px 20px 72px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.logo{flex:none;width:54px;height:54px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;transform:rotate(-6deg);box-shadow:0 8px 20px -8px var(--acc)}
h1{font-size:clamp(1.9rem,6.4vw,3.5rem);font-weight:800;letter-spacing:-.035em;line-height:1;margin:0}
h1 .r{color:var(--acc)}
h1 .l{display:block}
.sub{color:var(--mute);margin:0 0 26px;max-width:54ch}
#drop{display:block;border:2px dashed var(--line);border-radius:24px;background:var(--card);padding:40px 20px;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:border-color .15s,background .15s,transform .15s}
#drop:hover,#drop.over{border-color:var(--acc);transform:translateY(-2px)}
#drop.over{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
#drop svg{width:46px;height:46px;color:var(--acc);margin-bottom:6px}
#drop strong{display:block;font-size:1.3rem}
#drop span{color:var(--mute);font-size:.95rem}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
#drop:focus-within{outline:3px solid var(--acc2);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:24px 0 14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.bar.plain{background:none;border:0;box-shadow:none;padding:0}
.bar label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute);font-weight:600}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:150px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;transition:border-color .15s,transform .1s}
button:hover{border-color:var(--acc)}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);padding:13px 26px;font-size:1.08rem;font-weight:800;box-shadow:0 10px 24px -10px var(--acc)}
button.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.sp{flex:1}
#list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#list li{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;transition:border-color .2s,box-shadow .2s}
#list li.drag{opacity:.4}
#list li.target{border-color:var(--acc2)}
#list li.run{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
#list li.run::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--acc);animation:slide 1s linear infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#list li.run::after{animation:none;width:100%}#drop,button{transition:none}}
.pg{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--mute)}
#list img{flex:none;width:60px;height:60px;object-fit:cover;border-radius:10px;background:var(--bg)}
.meta{flex:1;min-width:0}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{color:var(--mute)}
.chip{flex:none;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--mute)}
.run .chip{background:var(--acc);color:#fff}
.ok .chip{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.bad .chip{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.acts{display:flex;gap:6px}
.acts button{padding:6px 10px}
.handle{cursor:grab;color:var(--mute);user-select:none;font-size:1.2rem}
@media (max-width:600px){#list li{flex-wrap:wrap}.meta{flex-basis:calc(100% - 150px)}.acts{margin-left:auto}.handle{display:none}}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:16px}
.prog[hidden]{display:none}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:width .2s}
#status{margin:8px 0 0;min-height:1.5em;color:var(--mute)}
#status.err{color:var(--err)}
.done{display:none;margin-top:20px;background:var(--card);border:1px solid var(--ok);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.done.show{display:block}
</style>
</head>
<body>
<main>
<div class="brand">
  <div class="logo" aria-hidden="true">PDF</div>
  <h1><span class="l">CAK IMAM</span><span class="r">PDF CONVERTER</span></h1>
</div>
<p class="sub">Gabungkan banyak gambar menjadi satu file PDF. Gambar dikompres satu per satu dari atas ke bawah. Semua diproses di perangkat Anda, tidak ada yang diunggah.</p>

<label id="drop">
  <input id="file" type="file" accept="image/*" multiple>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
  <strong>Pilih gambar atau seret ke sini</strong>
  <span>JPG, PNG, WEBP, GIF, BMP, SVG. Bisa pilih banyak sekaligus.</span>
</label>

<div class="bar" id="opts" hidden>
  <label>Ukuran halaman
    <select id="size">
      <option value="a4">A4</option>
      <option value="letter">Letter</option>
      <option value="fit">Sesuai ukuran gambar</option>
    </select>
  </label>
  <label>Margin
    <select id="margin">
      <option value="0">Tanpa margin</option>
      <option value="10" selected>Sedang</option>
      <option value="20">Lebar</option>
    </select>
  </label>
  <label>Kompresi gambar
    <select id="comp">
      <option value="orig">Kualitas asli</option>
      <option value="med" selected>Sedang (hemat ukuran)</option>
      <option value="high">Tinggi (file kecil)</option>
      <option value="max">Maksimal (file terkecil)</option>
    </select>
  </label>
  <label>Nama file
    <input id="name" type="text" value="gambar-gabungan">
  </label>
  <span class="sp"></span>
  <button id="clear" type="button">Hapus semua</button>
</div>

<ul id="list"></ul>

<div class="bar plain" id="go" hidden>
  <button id="make" class="primary" type="button">Buat PDF</button>
</div>
<div class="prog" id="prog" role="progressbar" aria-label="Progres" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div id="progBar"></div></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="done" id="done">
  <b id="doneTitle"></b>
  <p id="doneInfo" style="margin:4px 0 12px;color:var(--mute)"></p>
  <button id="save" class="primary" type="button">Simpan PDF</button>
</div>
</main>

<script>
(function(){
var items=[],uid=0,pdfBlob=null;
var $=function(i){return document.getElementById(i)};
var list=$('list'),statusEl=$('status');

function setStatus(t,err){statusEl.textContent=t||'';statusEl.className=err?'err':''}
function prog(f){
  var p=$('prog');
  if(f===null){p.hidden=true;return}
  var v=Math.max(0,Math.min(100,Math.round(f*100)));
  p.hidden=false;$('progBar').style.width=v+'%';p.setAttribute('aria-valuenow',v);
}
function fmt(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}

function addFiles(fs){
  var arr=Array.prototype.slice.call(fs).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|svg)$/i.test(f.name)});
  if(!arr.length){setStatus('Tidak ada file gambar yang valid.',true);return}
  var fresh=arr.map(function(f){return {id:++uid,file:f,url:URL.createObjectURL(f),rot:0,cdata:null,csize:0,st:'wait'}});
  fresh.forEach(function(it){items.push(it)});
  setStatus('');resetDone();render();
  if(!running)runQueue();
}

var busy=0,running=false;
function preset(){return {orig:{q:0.92,max:3000},med:{q:0.75,max:2000},high:{q:0.55,max:1400},max:{q:0.4,max:1000}}[$('comp').value]}
function compressAll(){
  /* antrean tunggal: file diproses satu per satu dari paling atas ke paling bawah */
  var i;for(i=0;i<items.length;i++)if(items[i].st==='run')items[i].st='wait';
  if(!running)runQueue();
}
async function runQueue(){
  running=true;busy=1;$('make').disabled=true;resetDone();
  while(true){
    var it=null,done=0;
    for(var k=0;k<items.length;k++){
      if(items[k].st==='wait'&&!it)it=items[k];
      if(items[k].st==='done'||items[k].st==='err')done++;
    }
    if(!it)break;
    var total=items.length,pos=items.indexOf(it)+1;
    it.st='run';render();
    setStatus('Mengompres gambar '+pos+' dari '+total+': '+it.file.name);
    prog(done/total);
    await new Promise(function(r){setTimeout(r,30)});
    var key=$('comp').value,P=preset();
    try{
      var im=await loadImg(it.url);
      var w=im.naturalWidth||im.width||800,h=im.naturalHeight||im.height||600;
      var sc=Math.min(1,P.max/Math.max(w,h)),cw=Math.round(w*sc),ch=Math.round(h*sc);
      var c=document.createElement('canvas');c.width=cw;c.height=ch;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);
      it.cdata=c.toDataURL('image/jpeg',P.q);
      it.csize=Math.round((it.cdata.length-23)*3/4);
      it.st='done';
    }catch(e){it.cdata=null;it.csize=0;it.st='err'}
    if(items.indexOf(it)>=0&&it.st!=='err'&&$('comp').value!==key)it.st='wait';
    render();
    await new Promise(function(r){setTimeout(r,0)});
  }
  running=false;busy=0;
  prog(1);setTimeout(function(){if(!busy)prog(null)},600);
  $('make').disabled=false;
  var ok=items.filter(function(i){return i.cdata}),bad=items.length-ok.length;
  var o=ok.reduce(function(s,i){return s+i.file.size},0),z=ok.reduce(function(s,i){return s+i.csize},0);
  if(bad)setStatus(bad+' gambar tidak bisa dibaca. Hapus lalu coba file lain.',true);
  else if(ok.length&&z<o)setStatus('Semua gambar sudah dikompres: '+fmt(o)+' menjadi '+fmt(z)+' (hemat '+Math.round((1-z/o)*100)+'%).');
  else if(ok.length)setStatus('Semua gambar sudah diproses ('+fmt(z)+'). Ukurannya sudah kecil, jadi hampir tidak berubah.');
  else setStatus('');
}
function resetDone(){pdfBlob=null;$('done').classList.remove('show')}

function render(){
  list.innerHTML='';
  items.forEach(function(it,i){
    var li=document.createElement('li');li.draggable=true;li.dataset.i=i;
    li.className=it.st==='run'?'run':it.st==='done'?'ok':it.st==='err'?'bad':'';
    li.innerHTML='<span class="handle" aria-hidden="true">⠿</span><span class="pg"></span><img alt=""><div class="meta"><b></b><small></small></div><span class="chip"></span><div class="acts"><button type="button" data-a="rl" aria-label="Putar kiri">⟲</button><button type="button" data-a="rr" aria-label="Putar kanan">⟳</button><button type="button" data-a="up" aria-label="Naik">↑</button><button type="button" data-a="down" aria-label="Turun">↓</button><button type="button" data-a="del" aria-label="Hapus">✕</button></div>';
    li.querySelector('.pg').textContent=i+1;
    var th=li.querySelector('img');th.src=it.cdata||it.url;th.style.transform='rotate('+it.rot+'deg)';th.style.transition='transform .2s';
    li.querySelector('b').textContent=it.file.name;
    li.querySelector('.chip').textContent=it.st==='run'?'Memproses':it.st==='done'?'Selesai':it.st==='err'?'Gagal':'Menunggu';
    li.querySelector('small').textContent=it.st==='err'?'Tidak bisa dibaca':it.cdata?fmt(it.file.size)+' → '+fmt(it.csize)+(it.csize<it.file.size?' (−'+Math.round((1-it.csize/it.file.size)*100)+'%)':''):fmt(it.file.size);
    list.appendChild(li);
  });
  var has=items.length>0;
  $('opts').hidden=!has;$('go').hidden=!has;
  $('make').textContent='Buat PDF ('+items.length+' halaman)';
}

list.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var i=+b.closest('li').dataset.i,a=b.dataset.a;
  if(a==='rl'){items[i].rot=(items[i].rot+270)%360}
  else if(a==='rr'){items[i].rot=(items[i].rot+90)%360}
  else if(a==='del'){URL.revokeObjectURL(items[i].url);items.splice(i,1)}
  else if(a==='up'&&i>0){items.splice(i-1,0,items.splice(i,1)[0])}
  else if(a==='down'&&i<items.length-1){items.splice(i+1,0,items.splice(i,1)[0])}
  resetDone();render();
});

var dragI=null;
list.addEventListener('dragstart',function(e){var li=e.target.closest('li');if(!li)return;dragI=+li.dataset.i;li.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','x')}catch(_){}});
list.addEventListener('dragover',function(e){if(dragI===null)return;e.preventDefault();var li=e.target.closest('li');[].forEach.call(list.children,function(c){c.classList.remove('target')});if(li)li.classList.add('target')});
list.addEventListener('drop',function(e){if(dragI===null)return;e.preventDefault();var li=e.target.closest('li');if(li){var j=+li.dataset.i;items.splice(j,0,items.splice(dragI,1)[0]);resetDone()}dragI=null;render()});
list.addEventListener('dragend',function(){dragI=null;render()});

$('file').addEventListener('change',function(e){addFiles(e.target.files);e.target.value=''});
var drop=$('drop');
['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){if(dragI!==null)return;e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
$('clear').addEventListener('click',function(){items.forEach(function(it){URL.revokeObjectURL(it.url)});items=[];resetDone();setStatus('');render()});
['size','margin','name'].forEach(function(id){$(id).addEventListener('input',resetDone)});
$('comp').addEventListener('change',function(){items.forEach(function(it){if(it.st!=='run')it.st='wait'});if(items.length)compressAll()});

function loadImg(url){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error('load'))};im.src=url})}

async function build(){
  var JS=window.jspdf&&window.jspdf.jsPDF;
  if(!JS)throw new Error('Pustaka PDF gagal dimuat. Muat ulang halaman dan coba lagi.');
  var mode=$('size').value,m=+$('margin').value,px=0.264583,doc=null;
  for(var i=0;i<items.length;i++){
    setStatus('Menyusun halaman '+(i+1)+' dari '+items.length+'… '+Math.round(i/items.length*100)+'%');
    prog(i/items.length);
    var im;
    try{im=await loadImg(items[i].cdata||items[i].url)}catch(e){throw new Error('Gambar "'+items[i].file.name+'" tidak bisa dibaca.')}
    var w0=im.naturalWidth||im.width||800,h0=im.naturalHeight||im.height||600;
    var rot=items[i].rot||0,swap=rot%180!==0;
    var w=swap?h0:w0,h=swap?w0:h0;
    var P={orig:{q:0.92,max:3000},med:{q:0.75,max:2000},high:{q:0.55,max:1400},max:{q:0.4,max:1000}}[$('comp').value];
    var sc=items[i].cdata?1:Math.min(1,P.max/Math.max(w,h));
    var cw=Math.round(w*sc),ch=Math.round(h*sc);
    var c=document.createElement('canvas');c.width=cw;c.height=ch;
    var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);
    var iw=swap?ch:cw,ih=swap?cw:ch;
    ctx.translate(cw/2,ch/2);ctx.rotate(rot*Math.PI/180);ctx.drawImage(im,-iw/2,-ih/2,iw,ih);
    var data=(items[i].cdata&&!rot)?items[i].cdata:c.toDataURL('image/jpeg',P.q);
    var pw,ph,orient;
    if(mode==='fit'){pw=w*px;ph=h*px;m=0}
    else{var base=mode==='letter'?[215.9,279.4]:[210,297];orient=w>h?'l':'p';pw=orient==='l'?base[1]:base[0];ph=orient==='l'?base[0]:base[1]}
    orient=pw>ph?'l':'p';
    if(!doc)doc=new JS({unit:'mm',format:[pw,ph],orientation:orient,compress:true});
    else doc.addPage([pw,ph],orient);
    var aw=pw-2*m,ah=ph-2*m,r=Math.min(aw/w,ah/h),dw=w*r,dh=h*r;
    doc.addImage(data,'JPEG',(pw-dw)/2,(ph-dh)/2,dw,dh,undefined,'FAST');
    m=+$('margin').value;
    await new Promise(function(r){setTimeout(r,0)});
  }
  return doc.output('blob');
}

$('make').addEventListener('click',async function(){
  if(!items.length||busy)return;
  var btn=$('make');btn.disabled=true;resetDone();
  try{
    pdfBlob=await build();
    setStatus('');
    $('doneTitle').textContent='PDF siap';
    var tot=items.reduce(function(s,it){return s+it.file.size},0);
    var info=items.length+' halaman, '+fmt(pdfBlob.size);
    if(pdfBlob.size<tot)info+=' (dari '+fmt(tot)+', hemat '+Math.round((1-pdfBlob.size/tot)*100)+'%)';
    else info+=' (gambar asli '+fmt(tot)+'; coba kompresi lebih tinggi untuk memperkecil)';
    $('doneInfo').textContent=info;
    $('done').classList.add('show');
    prog(1);
  }catch(e){setStatus(e.message||'Gagal membuat PDF.',true)}
  setTimeout(function(){if(!busy)prog(null)},600);
  btn.disabled=false;
});

function fileName(){var n=($('name').value||'gambar-gabungan').replace(/[\\\/:*?"'<>|]+/g,'').trim()||'gambar-gabungan';return n.replace(/\.pdf$/i,'')+'.pdf'}

$('save').addEventListener('click',async function(){
  if(!pdfBlob)return;
  var d=null;
  try{d=window.claude&&await window.claude.use('downloads')}catch(_){}
  try{
    if(d){await d.save({filename:fileName(),data:pdfBlob});setStatus('PDF disimpan.')}
    else{
      var a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob);a.download=fileName();document.body.appendChild(a);a.click();a.remove();
      setStatus('Mengunduh PDF…');
    }
  }catch(e){
    if(e&&e.code==='declined')setStatus('Penyimpanan dibatalkan.');
    else setStatus('PDF tidak bisa disimpan di sini. Buka halaman ini di tab browser sendiri lalu coba lagi.',true);
  }
});
render();
})();
</script>
</body>
</html>
